<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}みんなの掲示板{% endblock %} | Campus Link</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/form.js"></script>
<a class="skip" href="#content">本文へ移動</a><header><div class="bar"><a class="brand" href="/"><img src="/static/campus-link.svg" width="40" height="40" alt="">Campus Link</a><a class="button" href="/new">＋ 投稿する</a></div></header>
<div class="layout"><aside><nav aria-label="掲示板ナビゲーション"><small>掲示板</small><a href="/" {% if request.path=='/' and not category %}aria-current="page"{% endif %} class="{{ 'active' if request.path=='/' and not category }}">すべての投稿</a><small>カテゴリ</small>{% for c in ['勉強','課題','進路','部活動','相談','雑談'] %}<a {% if category==c %}aria-current="page"{% endif %} class="{{ 'active' if category==c }}" href="{{ url_for('index',category=c) }}"><span>#</span> {{ c }}</a>{% endfor %}</nav></aside><main id="content">{% for msg in get_flashed_messages() %}<p class="notice" role="status">{{ msg }}</p>{% endfor %}{% block body %}{% endblock %}</main><aside class="guide"><h2>投稿の前に</h2><p>ニックネームで参加できます。本名・学校名・連絡先は書かないでください。</p><hr><p>写真を添付するときは、顔や名札の写り込みも確認しましょう。</p></aside></div></html>
