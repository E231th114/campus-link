<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><script defer src="/static/categories.js"></script><title>{% block title %}みんなの掲示板{% endblock %} | Campus Link</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/form.js"></script>
<a class="skip" href="#content">本文へ移動</a><header><div class="bar"><a class="brand" href="/"><img src="/static/campus-link.svg" width="40" height="40" alt="">Campus Link</a><a class="button" href="/new">投稿する</a></div></header>
<div class="layout"><aside class="categories {{ 'list-nav' if request.endpoint=='index' }}"><nav aria-label="掲示板ナビゲーション"><a href="{{ url_for('index', **dict(request.args, category='')) }}" {% if request.path=='/' and not category %}aria-current="page"{% endif %} class="{{ 'active' if request.path=='/' and not category }}">すべての投稿</a><small>カテゴリ</small>{% for c in ['勉強','課題','進路','部活動','相談','雑談'] %}<a {% if category==c %}aria-current="page"{% endif %} class="{{ 'active' if category==c }}" href="{{ url_for('index', **dict(request.args, category=c)) }}">{{ c }}</a>{% endfor %}</nav><button type="button" class="category-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="category-sheet" hidden>
  <span data-category-name></span>
  <svg class="category-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
</button>
<dialog id="category-sheet" aria-labelledby="category-title">
  <div class="sheet-heading">
    <h2 id="category-title">カテゴリを選択</h2>
    <button type="button" data-close-category aria-label="閉じる"><svg class="category-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div data-category-options></div>
</dialog></aside><main id="content">{% for kind,msg in get_flashed_messages(with_categories=true) %}<p class="notice" role="status" data-result="{{kind}}">{{ msg }}</p>{% endfor %}{% block body %}{% endblock %}</main></div>{% include "mobile_nav.html" %}</html>
