<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}みんなの掲示板{% endblock %} | Campus Link</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/form.js"></script>
<header><div class="bar"><a class="brand" href="/"><i aria-hidden="true">C</i>Campus Link</a><a class="button" href="/new">＋ 投稿する</a></div></header>
<div class="layout"><aside><nav aria-label="掲示板ナビゲーション"><small>掲示板</small><a href="/" class="{{ 'active' if request.path=='/' and not category }}">すべての投稿</a><small>カテゴリ</small>{% for c in ['勉強','課題','進路','部活動','相談','雑談'] %}<a class="{{ 'active' if category==c }}" href="{{ url_for('index',category=c) }}"><span>#</span> {{ c }}</a>{% endfor %}</nav></aside><main>{% for msg in get_flashed_messages() %}<p class="notice" role="status">{{ msg }}</p>{% endfor %}{% block body %}{% endblock %}</main></div></html>
