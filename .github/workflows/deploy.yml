name: Test and deploy Campus Link

concurrency:
  group: campus-link-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py services/*.py scripts/*.py
  deploy-oidc:
    needs: test
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

  deploy-publish-profile:
    needs: test
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_WEBAPP_NAME != '' && (vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .

  smoke-test:
    needs: [deploy-oidc, deploy-publish-profile]
    if: always() && (needs.deploy-oidc.result == 'success' || needs.deploy-publish-profile.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check the public app
        env:
          CAMPUS_LINK_URL: ${{ vars.CAMPUS_LINK_URL }}
        run: |
          test -n "$CAMPUS_LINK_URL"
          body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$CAMPUS_LINK_URL/")"
          grep -q "Campus Link" <<< "$body"
          curl --fail --silent --show-error --location "$CAMPUS_LINK_URL/static/style.css" >/dev/null
          curl --fail --silent --show-error --location "$CAMPUS_LINK_URL/guide" >/dev/null
